<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Standardization and Validation</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- OpenLayers CSS -->
    <link rel="stylesheet" href="https://openlayers.org/en/v6.5.0/css/ol.css" type="text/css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/templates/styles.css">
    <link rel="stylesheet" href="/templates/style.css">
    <style>
        #map {
            width: 100%;
            height: 400px;
        }
        #info {
            margin-top: 10px;
        }

        #femaChart {
            width: 100%;
            height: 400px;
        }
        #legend {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 10px;
            border: 1px solid #ccc;
            z-index: 1000;
        }
        .criteria-container {
            visibility: none;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            position: fixed;
            top: 20px;
            right: 20px;
            width: 350px;
            height: auto;
            max-height: 800vh;
            overflow-x: auto;
            overflow-y: auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }
        .criteria-container__content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: auto;
        }
        .margin--small {
            margin: 8px 0;
        }
        .criteria-container__section {
            margin-bottom: 5px;
        }
        .input-field {
            margin-bottom: 15px;
        }
        .input-field label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #666;
        }
        .input-field input,
        .input-field select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .risk-level-selected-placeholder {
            font-weight: bold;
            color: #333;
        }
        .inline-block {
            display: inline-block;
            margin-right: 15px;
        }
        .fill--50p__wide {
            width: 50%;
        }
        .with-gap {
            margin-right: 8px;
        }
        .filled-in {
            margin-right: 8px;
        }
        .waves-effect {
            display: inline-block;
            padding: 10px 20px;
            background-color: #2196f3;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .waves-effect:hover {
            background-color: #1976d2;
        }
        .btn-large {
            font-size: 1.2em;
            padding: 12px 25px;
        }
        .blue.darken-4 {
            background-color: #0d47a1;
        }
        .fill__wide {
            width: 100%;
        }
        .flex {
            display: flex;
        }
        .flex-row {
            flex-direction: row;
        }
        .flex-wrap {
            flex-wrap: wrap;
        }
        .padding--small {
            padding: 8px;
        }
        .button {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Address Standardization and Validation</h1>
    <form id="addressForm">
        <label for="address">Enter Address:</label>
        <input type="text" id="address" name="address">
        <button type="submit">Submit</button>
    </form>
    <div id="info">
        <p>Before Standardization: <span id="beforeAddress"></span></p>
        <p>After Standardization: <span id="afterAddress"></span></p>
        <p>Confidence Score: <span id="confidenceScore"></span></p>
        <p>Summary: <span id="summary"></span></p>
        <p>Parcel Details: <span id="parcelDetails"></span></p>
<!--        <p>pedestrianEntrances: <span id="ppedestrianEntrances"></span></p>-->
<!--        <p>femaData: <span id="femaData"></span></p>-->
    </div>
    <div id="map" class="map"></div>
    <div id="legend">
        <h3>Legend</h3>
        <div>
            <input type="checkbox" id="layer1" checked>
            <label for="layer1">Layer 1</label>
        </div>
        <div>
            <input type="checkbox" id="layer2" checked>
            <label for="layer2">Layer 2</label>
        </div>
        <!-- Add more layers as needed -->
    </div>
    <div id="criteria" class="criteria-container visable">
        <div>
            <div class="criteria-container">
                <!-- <h3 class="criteria-container__title">-->
                <!-- <img src="static/app/images/circle_2.svg" alt="">-->
                <!--<!– <span>Requested Data</span>–>-->
                <!-- </h3>-->
            </div>
        </div>
        <div class="criteria-container__content white margin--small">
            <div class="selection-container">
                <div class="criteria-container__section risk-level-container col s6">
                    <div class="input-field ">
                        <div class="criteria-title-item">
                            <img class="title-icon" src="static/app/images/sm_icon_standard_version.svg" alt="">
                            <span>Standard Version</span>
                            <img class="info-icon" src="static/app/images/icon_info.svg" alt="" title="Select the Standard you wish to use for this report. Users who are unsure which building code reference document and version govern their project type and location should contact their local building department.">
                            <div class="risk-level-selector-container">
                                <p class="risk-level-selected-placeholder">ASCE/SEI 7-22</p>
                                <select id="standards-selector" class="standards-selector browser-default">
                                    <option value="default" disabled="">Select Standard Version</option>
                                    <option value="7-10">ASCE/SEI 7-10</option>
                                    <option value="7-16">ASCE/SEI 7-16</option>
                                    <option value="7-22">ASCE/SEI 7-22</option>
                                    <option value="41-17">ASCE/SEI 41-17</option>
                                    <option value="41-23">ASCE/SEI 41-23</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="criteria-container__section risk-level-container col s6">
                    <div class="input-field">
                        <div class="criteria-title-item">
                            <img class="title-icon" src="static/app/images/sm_icon_risk_level.svg" alt="">
                            <span>Risk Category</span>
                            <img class="info-icon" src="static/app/images/icon_info.svg" alt="" title="Select your structure's Risk Category. Risk Category is a classification of buildings and other structures based on the risk to human life, health, and welfare associated with their damage or failure by nature of their occupancy or use. A building or structure shall be assigned to the highest applicable risk category. (Required field for all load types.)">
                            <div class="risk-level-selector-container ">
                                <p class="risk-level-selected-placeholder">II</p>
                                <select id="risk-level-selector" class="risk-level-selector browser-default">
                                    <option value="default" disabled="">Select Risk Category</option>
                                    <option value="1">I</option>
                                    <option value="2">II</option>
                                    <option value="3">III</option>
                                    <option value="4">IV</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="criteria-container__section risk-level-container col s6">
                    <div class="input-field">
                        <div class="criteria-title-item">
                            <img class="title-icon" src="static/app/images/sm_icon_soil_class.svg" alt="">
                            <span>Site Soil Class</span>
                            <img class="info-icon" src="static/app/images/icon_info.svg" alt="" title="The site shall be classified as Site Class A, B,BC, C, CD, D, DE, E, or F in accordance with Chapter 20.11.4.2.1. Where the soil properties are not known in sufficient detail to determine the site class, risk-targeted maximum considered earthquake (MCER) spectral response accelerations shall be based on the most critical spectral response acceleration at each period of Site Class C, Site Class CD, and Site Class D, unless the Authority Having Jurisdiction determines, based on geotechnical data, that Site Class DE, E, or F soils are present at the site.">
                            <div class="risk-level-selector-container">
                                <p class="risk-level-selected-placeholder">Default</p>
                                <select id="site-soil-class-selector" class="risk-level-selector browser-default">
                                    <option value="disabled" disabled="">Select Soil Class</option>
                                    <option value="0">Default</option>
                                    <option value="1">A - Hard Rock</option>
                                    <option value="2">B - Rock</option>
                                    <option value="3">BC</option>
                                    <option value="4">C - Very Dense Soil and Soft Rock</option>
                                    <option value="5">CD</option>
                                    <option value="6">D - Stiff Soil</option>
                                    <option value="7">DE</option>
                                    <option value="8">E - Soft Clay Soil</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <hr>
            </div>
            <div class="criteria-container__section measurements-container">
                <div class="criteria-title-item">
                    <img class="title-icon" src="static/app/images/sm_icon_measurements.svg" alt="">
                    <span>Measurements</span>
                </div>
                <p class="inline-block fill--50p__wide">
                    <input type="radio" class="with-gap" name="group2" id="imperial" value="on" checked>
                    <label for="imperial">Customary</label>
                </p>
                <p class="inline-block fill--50p__wide">
                    <input type="radio" class="with-gap" name="group2" id="si" value="on">
                    <label for="si">SI</label>
                </p>
            </div>
            <div class="criteria-container__section">
                <div class="criteria-title-item">
                    <img class="title-icon" src="static/app/images/sm_icon_include.svg" alt="">
                    <span>Load Types</span>
                    <!-- <a class="select-all-include">Select all</a> -->
                </div>
                <div class="flex flex-row flex-wrap padding--small">
                    <p class="fill--50p__wide">
                        <input type="radio" class="with-gap" name="loadType" id="Wind" value="on">
                        <label class="" for="Wind">Wind</label>
                    </p>
                    <p class="fill--50p__wide">
                        <input type="radio" class="with-gap" name="loadType" id="Seismic" value="on">
                        <label class="" for="Seismic">Seismic</label>
                    </p>
                    <p class="fill--50p__wide">
                        <input type="radio" class="with-gap" name="loadType" id="Ice" value="on">
                        <label class="" for="Ice">Ice</label>
                    </p>
                    <p class="fill--50p__wide">
                        <input type="radio" class="with-gap" name="loadType" id="Snow" value="on">
                        <label class="" for="Snow">Snow</label>
                    </p>
                    <p class="fill--50p__wide">
                        <input type="radio" class="with-gap" name="loadType" id="Rain" value="on">
                        <label class="" for="Rain">Rain</label>
                    </p>
                    <p class="fill--50p__wide">
                        <input type="radio" class="with-gap" name="loadType" id="Flood" value="on">
                        <label class="" for="Flood">Flood</label>
                    </p>
                    <p class="fill--50p__wide">
                        <input type="radio" class="with-gap" name="loadType" id="Tsunami" value="on">
                        <label class="" for="Tsunami">Tsunami</label>
                    </p>
                    <p class="fill--50p__wide">
                        <input type="radio" class="with-gap" name="loadType" id="Tornado" value="on">
                        <label class="" for="Tornado">Tornado</label>
                    </p>
                </div>
            </div>
        </div>
        <div id="resultsButton" class="white padding--small margin--small button">
            <a class="waves-effect waves-light btn-large blue darken-4 fill__wide" id="viewResultsButton">View Results</a>
        </div>
    </div>
    <div id="femaChart"></div>
    
    <!-- 添加风速报告显示区域 -->


    <!-- Modal -->
    <div class="modal fade" id="exampleModalCenter" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLongTitle">Wind Load Report</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div id="windReport" class="modal-body">

            </div>
            <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
        </div>
    </div>
    
    <!-- jQuery (required for Bootstrap) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- OpenLayers JS -->
    <script src="https://openlayers.org/en/v6.5.0/build/ol.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom JS -->
    <script src="/templates/app.js"></script>
</body>
</html>
